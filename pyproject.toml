[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fishaudio-tts"
version = "0.2.1"
description = "Hermes-native Fish Audio TTS provider plugin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiaoyaner"}]
keywords = ["hermes-agent", "fish-audio", "tts", "voice-cloning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.entry-points."hermes_agent.plugins"]
fishaudio-tts = "hermes_fishaudio_tts"

[tool.setuptools]
py-modules = ["provider"]
packages = ["hermes_fishaudio_tts"]

[project.urls]
Homepage = "https://github.com/xiaoyaner-home/hermes-fishaudio-tts"
Repository = "https://github.com/xiaoyaner-home/hermes-fishaudio-tts"
Issues = "https://github.com/xiaoyaner-home/hermes-fishaudio-tts/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --rootdir=tests -q"
